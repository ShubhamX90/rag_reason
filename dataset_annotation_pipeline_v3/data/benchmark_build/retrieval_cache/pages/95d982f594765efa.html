<!DOCTYPE html><html lang="en"><head><meta charSet="utf-8"/><meta name="viewport" content="initial-scale=1, width=device-width"/><link rel="icon" href="/favicon.ico"/><title>World Consumer Rights Day | Vikaspedia - Social welfare</title><meta name="description" content="This topic provides information about World Consumer Rights Day - March 15. "/><meta name="keywords" content="consumer rights, consumer rights day, world consumer rights day, consumer day, consumer awareness"/><meta name="robots" content="index, follow, max-image-preview:large"/><link rel="canonical" href="https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education/world-consumer-rights-day?lgn=en"/><link rel="alternate" hrefLang="en" href="https://en.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education/world-consumer-rights-day?lgn=en"/><meta property="og:title" content="World Consumer Rights Day"/><meta property="og:description" content="This topic provides information about World Consumer Rights Day - March 15. "/><meta property="og:url" content="https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education/world-consumer-rights-day?lgn=en"/><meta property="og:type" content="article"/><meta property="og:image" content="https://static.vikaspedia.in/mediastorage/filestorage/20260224112045_worldconsumerday.webp"/><meta name="twitter:card" content="summary_large_image"/><meta name="twitter:title" content="World Consumer Rights Day"/><meta name="twitter:description" content="This topic provides information about World Consumer Rights Day - March 15. "/><meta name="twitter:image" content="https://static.vikaspedia.in/mediastorage/filestorage/20260224112045_worldconsumerday.webp"/><meta name="twitter:site" content="@vikaspedia"/><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Social Welfare","item":"http://socialwelfare.vikaspedia.in/viewcontent/social-welfare?lgn=en"},{"@type":"ListItem","position":2,"name":"Fight against social evils ","item":"http://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness?lgn=en"},{"@type":"ListItem","position":3,"name":"Consumer Education","item":"http://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education?lgn=en"},{"@type":"ListItem","position":4,"name":"World Consumer Rights Day","item":"http://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education/world-consumer-rights-day?lgn=en"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","mainEntityOfPage":{"@type":"WebPage","@id":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education/world-consumer-rights-day?lgn=en"},"headline":"World Consumer Rights Day","description":"This topic provides information about World Consumer Rights Day - March 15. ","image":"https://static.vikaspedia.in/mediastorage/filestorage/20260224112045_worldconsumerday.webp","author":{"@type":"Person","name":"Viji"},"keywords":["consumer rights","consumer rights day","world consumer rights day","consumer day","consumer awareness"],"articleBody":"<p>Every year 15th March is celebrated as the World Consumer Rights Day.</p>\n<p>World Consumer Rights Day was inspired by President John F Kennedy, who sent a special message to the US Congress on 15th March 1962, in which he formally addressed the issue of consumer rights. He was the first world leader to do so. The consumer movement first marked that date in 1983 and now uses the day every year to mobilise action on important issues and campaigns.</p>\n<h3>Objective</h3>\n<p>World Consumer Rights Day is an annual international event that signifies celebration and solidarity in the international consumer movement, demanding that, consumer rights are to be respected and protected. The event also gives a chance to protest against the market abuses and social injustices which undermine those rights.</p>\n<h3>Theme for 2026</h3>\n<p><img style=\"max-width: 100%; height: 238px; float: right;\" src=\"https://static.vikaspedia.in/mediastorage/filestorage/20260224112045_worldconsumerday.webp\" alt=\"Uploaded Image\" width=\"238\">Each year, World Consumer Rights Day adopts a theme to highlight. This year the theme promoted is <strong>\"Safe Products, Confident Consumers\"</strong>.</p>\n<p>Manufactured products are part of everyday life, yet their safety is not always guaranteed. From design and manufacturing to marketing and sale, countless decisions determine whether goods are reliable, compliant and fit for purpose.</p>\n<p>Across the world, consumers continue to encounter unsafe products &ndash; from children&rsquo;s toys and household electronics to medicines and daily essentials. As global supply chains grow more complex and online commerce expands, dangerous products move faster and further. &nbsp;Product safety is more than a regulatory issue, it is fundamental to the human rights to life, health and safety. When systems fall short, consumers pay the price through injury, financial loss, environmental harm and, in the most serious cases, loss of life. Addressing these risks requires coordinated cross-border action, stronger enforcement and closer collaboration between governments, businesses and consumer organisations</p>\n<p>The campaign will advance the following</p>\n<ul>\n<li>Raising understanding and awareness that insufficient product safety undermines core human rights to life, health, and safety. &nbsp;</li>\n<li>When consumer groups, as the voice of consumers, are at the forefront of debates and policymaking and supported to contribute insights, evidence, and solutions, &nbsp;effective consumer-driven outcomes result. &nbsp;</li>\n<li>Strong collaboration between business, governments and consumer groups is essential to guarantee that safety is upheld at every stage of the product lifecycle. &nbsp;</li>\n<li>Robust cross-border safety systems are essential - including the use of innovation for effective information-sharing, the coordination of product recalls, and for the effective enforcement of policy and practice. &nbsp;</li>\n<li>Unified global standards and regulatory frameworks can help to see that all consumers are protected and will drive global cooperation and accountability. &nbsp;</li>\n</ul>\n<p><strong>Source : <a class=\"ext-link-icon external-link\" title=\"External website that opens in new window\" href=\"https://www.consumersinternational.org/what-we-do/world-consumer-rights-day/\" target=\"_blank\" rel=\"noopener\">Consumers International</a></strong></p>","contributor":{"@type":"Person","name":"Viji"},"publisher":{"@type":"GovernmentOrganization","name":"CDAC-Hyderabad","url":"https://www.cdac.in/","logo":{"@type":"ImageObject","url":"https://www.cdac.in/img/cdac-logo.png"}},"datePublished":"2018-03-14T04:32:16.000+00:00","dateModified":"2026-02-24T05:18:15.000+00:00","inLanguage":"en","isPartOf":{"@type":"WebSite","name":"Vikaspedia - Social welfare","url":"https://vikaspedia.in"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"World Consumer Rights Day | Vikaspedia - Social welfare","description":"This topic provides information about World Consumer Rights Day - March 15. ","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education/world-consumer-rights-day?lgn=en","inLanguage":"en","publisher":{"@type":"GovernmentOrganization","name":"Centre for Development of Advanced Computing (C-DAC).","url":"https://www.cdac.in/","parentOrganization":{"@type":"GovernmentOrganization","name":"Ministry of Electronics and Information Technology (MeitY)","url":"https://www.meity.gov.in/"}},"speakable":{"@type":"SpeakableSpecification","xpath":["//article//h1","//article//p[1]"]}}</script><script -welfare/social-awareness/human-trafficking-1/world-day-against-trafficking-in-persons?lgn=en"},{"lgn":"en","context_path":"/social-welfare/financial-inclusion/world-thrift-day","domain":"Social-Welfare","language":"English","id":416741,"title":"World Thrift Day","summery":"Provides information about World Thrift Day, celebrated every year on 31st October worldwide to promote savings and financial security of individual and nation as a whole.","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/financial-inclusion/world-thrift-day?lgn=en"},{"lgn":"en","context_path":"/social-welfare/social-awareness/world-day-of-social-justice","domain":"Social-Welfare","language":"English","id":417311,"title":"World Day of Social Justice","summery":"Provides information about World Day of Social Justice - 20 February","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/world-day-of-social-justice?lgn=en"},{"lgn":"en","context_path":"/social-welfare/entrepreneurship/world-intellectual-property-day","domain":"Social-Welfare","language":"English","id":420896,"title":"World Intellectual Property Day","summery":"World Intellectual Property Day is celebrated on April 26 every year. ","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/entrepreneurship/world-intellectual-property-day?lgn=en"},{"lgn":"en","context_path":"/social-welfare/social-awareness/consumer-education/world-accreditation-day","domain":"Social-Welfare","language":"English","id":421094,"title":"World Accreditation Day","summery":"World Accreditation Day is celebrated every year on June 9","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education/world-accreditation-day?lgn=en"},{"lgn":"en","context_path":"/social-welfare/social-awareness/consumer-education/united-nations-guidelines-for-consumer-protection","domain":"Social-Welfare","language":"English","id":423063,"title":"United Nations guidelines for consumer protection","summery":"Provides information about United Nations guidelines for consumer protection","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education/united-nations-guidelines-for-consumer-protection?lgn=en"}],"content":"\u003cp\u003eEvery year 15th March is celebrated as the World Consumer Rights Day.\u003c/p\u003e\n\u003cp\u003eWorld Consumer Rights Day was inspired by President John F Kennedy, who sent a special message to the US Congress on 15th March 1962, in which he formally addressed the issue of consumer rights. He was the first world leader to do so. The consumer movement first marked that date in 1983 and now uses the day every year to mobilise action on important issues and campaigns.\u003c/p\u003e\n\u003ch3\u003eObjective\u003c/h3\u003e\n\u003cp\u003eWorld Consumer Rights Day is an annual international event that signifies celebration and solidarity in the international consumer movement, demanding that, consumer rights are to be respected and protected. The event also gives a chance to protest against the market abuses and social injustices which undermine those rights.\u003c/p\u003e\n\u003ch3\u003eTheme for 2026\u003c/h3\u003e\n\u003cp\u003e\u003cimg style=\"max-width: 100%; height: 238px; float: right;\" src=\"https://static.vikaspedia.in/mediastorage/filestorage/20260224112045_worldconsumerday.webp\" alt=\"Uploaded Image\" width=\"238\"\u003eEach year, World Consumer Rights Day adopts a theme to highlight. This year the theme promoted is \u003cstrong\u003e\"Safe Products, Confident Consumers\"\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eManufactured products are part of everyday life, yet their safety is not always guaranteed. From design and manufacturing to marketing and sale, countless decisions determine whether goods are reliable, compliant and fit for purpose.\u003c/p\u003e\n\u003cp\u003eAcross the world, consumers continue to encounter unsafe products \u0026ndash; from children\u0026rsquo;s toys and household electronics to medicines and daily essentials. As global supply chains grow more complex and online commerce expands, dangerous products move faster and further. \u0026nbsp;Product safety is more than a regulatory issue, it is fundamental to the human rights to life, health and safety. When systems fall short, consumers pay the price through injury, financial loss, environmental harm and, in the most serious cases, loss of life. Addressing these risks requires coordinated cross-border action, stronger enforcement and closer collaboration between governments, businesses and consumer organisations\u003c/p\u003e\n\u003cp\u003eThe campaign will advance the following\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRaising understanding and awareness that insufficient product safety undermines core human rights to life, health, and safety. \u0026nbsp;\u003c/li\u003e\n\u003cli\u003eWhen consumer groups, as the voice of consumers, are at the forefront of debates and policymaking and supported to contribute insights, evidence, and solutions, \u0026nbsp;effective consumer-driven outcomes result. \u0026nbsp;\u003c/li\u003e\n\u003cli\u003eStrong collaboration between business, governments and consumer groups is essential to guarantee that safety is upheld at every stage of the product lifecycle. \u0026nbsp;\u003c/li\u003e\n\u003cli\u003eRobust cross-border safety systems are essential - including the use of innovation for effective information-sharing, the coordination of product recalls, and for the effective enforcement of policy and practice. \u0026nbsp;\u003c/li\u003e\n\u003cli\u003eUnified global standards and regulatory frameworks can help to see that all consumers are protected and will drive global cooperation and accountability. \u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSource : \u003ca class=\"ext-link-icon external-link\" title=\"External website that opens in new window\" href=\"https://www.consumersinternational.org/what-we-do/world-consumer-rights-day/\" target=\"_blank\" rel=\"noopener\"\u003eConsumers International\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e","lgn":"en","depth":4,"updated_at":"2026-02-24T05:18:15.000+00:00","subHeading":"\u003col\u003e\u003cli\u003e\u003ca href='#section1' \u003eObjective\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section2' \u003eTheme for 2026\u003c/a\u003e\u003c/li\u003e\u003c/ol\u003e","domain":3,"context_type":"document","isInfoBotPage":false,"id":3310,"isCopy":false,"relatedKeywords":["consumer rights","consumer rights day","world consumer rights day","consumer day","consumer awareness"],"status":[{"isCurrent":false,"label":"Review in Process","value":1},{"isCurrent":true,"label":"Open","value":3},{"isCurrent":false,"label":"Deleted","value":4},{"isCurrent":false,"label":"Private","value":5},{"isCurrent":false,"label":"Published","value":6}]},"ssrBreadcrumbs":[{"url":"/social-welfare","title":"Social Welfare","id":3834},{"url":"/social-welfare/social-awareness","title":"Fight against social evils ","id":3832},{"url":"/social-welfare/social-awareness/consumer-education","title":"Consumer Education","id":3437},{"url":"/social-welfare/social-awareness/consumer-education/world-consumer-rights-day","title":"World Consumer Rights Day","id":3310}],"ssrDomainInfo":{"ocrLang":[{"value":"en","name":"English","id":1,"label":"English"},{"name":"Hindi","label":"हिन्दी","id":2,"value":"hi"},{"name":"Marathi","id":3,"value":"mr","label":"मराठी"},{"value":"bn","name":"Bengali","label":"বাংলা","id":5},{"id":8,"value":"gu","label":"ગુજરાતી","name":"Gujarati"},{"name":"Nepali","id":9,"label":"नेपाली","value":"ne"},{"id":10,"label":"ಕನ್ನಡ","name":"Kannada","value":"kn"},{"name":"Maithili","id":13,"value":"mai","label":"मैथिली"},{"value":"ml","id":14,"name":"Malayalam","label":"മലയാളം"},{"label":"ਪੰਜਾਬੀ","name":"Punjabi","id":17,"value":"pa"},{"value":"ta","label":"தமிழ்","name":"Tamil","id":21},{"label":"తెలుగు","name":"T
