"hasUserFilledLeadgenForm\":null,\"isProfileAd\":false,\"skadnetworkClickThroughInfo\":null,\"skadnetworkViewThroughInfo\":null,\"videoHash\":null,\"businessName\":\"PracticalEnlightenment.com\",\"contentText\":\"Sign Up for Free to Our Newsletter About Practical Spiritual Enlightenment.\",\"title\":\"Free Newsletter About Spiritual Enlightenment.\",\"ctaString\":\"Sign Up\",\"imageUrl\":\"https://qph.cf2.quoracdn.net/main-qimg-d4dddd685e3fb732589dad5a8cdba6dd\",\"imageDominantColor\":\"#fbf2e7\",\"mediaWidth\":602,\"mediaHeight\":316,\"urlTemplate\":\"https://PracticalEnlightenment.com\",\"shouldScaleImage\":false,\"logo\":{\"imageUrl\":\"https://qph.cf2.quoracdn.net/main-qimg-2baa25835d3b9a418c2ad27a769650a2\",\"id\":\"QWRMb2dvQDA6MTkwMzcz\"},\"isSelectedForFeedSurvey\":false,\"isSelectedForQuestionPageSurvey\":false,\"viewerHasRepliedToSurvey\":false,\"numUpvotes\":473,\"leadgenFormId\":null,\"logoImageUrl\":\"https://qph.cf2.quoracdn.net/main-qimg-2baa25835d3b9a418c2ad27a769650a2\",\"streamType\":\"two_tower_question_page\"},\"id\":\"UXVlc3Rpb25BZEl0ZW1AMDoxMTg2NDk3MjI6YWQ6MjExMTA2MjQyODY3ODQ5LTM=\"},{\"adLocation\":\"inline_question\",\"ad\":{\"answer\":{\"id\":\"QW5zd2VyQDA6MTQ3Nzc0MzkwMzcxNTgxMA==\",\"viewHash\":\"a-1477743903715810_5ae6842f8fa828ddaf4bd7fb44357f19\",\"aid\":1477743903715810,\"__typename\":\"Answer\",\"content\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"The \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"value of a natural diamond\\\", \\\"modifiers\\\": {\\\"link\\\": {\\\"type\\\": \\\"url\\\", \\\"url\\\": \\\"https://www.naturaldiamonds.com/in/love-diamonds/natural-diamond-emotional-value/\\\"}}}, {\\\"text\\\": \\\" today lies in the responsibility embedded in its authentic journey, from the mine to the market. Understanding and verifying this journey is essential because a purchase grounded in awareness and integrity transforms a diamond from a commodity into a conscious choice.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Transparency and Certification\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Consumers should begin by requesting certification from a globally recognised gemological laboratory such as \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"GIA or IGI\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\", which confirms a diamond\\\\u2019s natural origin and grading. These laboratories employ advanced techniques to \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"distinguish natural diamonds from laboratory-grown\\\", \\\"modifiers\\\": {\\\"link\\\": {\\\"type\\\": \\\"url\\\", \\\"url\\\": \\\"https://www.naturaldiamonds.com/in/diamond-facts-info/natural-vs-lab-grown-diamonds-everything-you-need-to-know-about-why-theyre-different/\\\"}}}, {\\\"text\\\": \\\" or treated stones, and laser inscriptions linked to certification numbers allow buyers to verify details independently.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Ethical Sourcing and Conflict-Free Assurance\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Ensuring that a diamond is ethically sourced is equally important. Backed by the United Nations and World Trade Organisation, the \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Kimberley Process Certification Scheme (KPCS)\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\" remains the most widely recognised system for guaranteeing conflict-free diamonds, ensuring that trade contributes to legitimate economic development. Buyers should look for jewellers who source their diamonds through Kimberley Process\\\\u2013certified channels, and they can request documentation or confirmation to ensure the diamond was imported in compliance with these standards.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Traceability: Digital Tracking\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Traceability has emerged as a critical marker of responsible diamond sourcing. Advanced platforms like \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Tracr\\\\u2122\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\", a blockchain-enabled system by De Beers, or \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Sarine Diamond Journey\\\\u2122\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\" capture each stage of a diamond\\\\u2019s transformation, from its country of origin to its rough-to-polished evolution. These digital records provide transparency and accountability, enabling buyers to understand the complete story behind the stone.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Fair Trade Practices in Craftsmanship\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"ethical journey of a diamond\\\", \\\"modifiers\\\": {\\\"link\\\": {\\\"type\\\": \\\"url\\\", \\\"url\\\": \\\"https://www.naturaldiamonds.com/in/inside-the-world-of-diamonds/the-journey-of-an-ethical-diamond/\\\"}}}, {\\\"text\\\": \\\" extends beyond its origin and traceability to the hands that shape it. Skilled artisans in cutting and polishing centres, such as Surat in India, play a decisive role in a diamond\\\\u2019s transformation. Choosing jewellers endorsed by the \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Responsible Jewellery Council (RJC)\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\" ensures fair wages, safe working conditions, and ethical practices, safeguarding both the craft and the people behind it.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Positive Impact and Sustainability\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"A responsible diamond also contributes to the broader community and environment. Leading jewellers invest in initiatives such as artisanal training, women-led workshops, landscape restoration, and other social programs. The use of recycled diamonds, responsibly reintroduced into the market, further reduces environmental impact while retaining all their intrinsic qualities.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"By verifying origin, ethical sourcing, traceability, artisan welfare, and community impact, consumers ensure that their purchase aligns with the values of responsibility and transparency. In this context, a diamond is more than a possession; it becomes a reflection of conscious choice, where authenticity and conscience define its enduring significance.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Ultimately, an ethically and sustainably sourced natural diamond is not just a symbol of beauty, but of integrity.\\\", \\\  {}}, {\\\"text\\\": \\\"Brontosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" (\\\\u201cthunder lizard,\\\\u201d for obvious reasons) in particular caught the public imagination, while \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Apatosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" (\\\\u201cdeceptive lizard,\\\\u201d because its chevron bones looked like those of mosasaurs, which of course are not dinosaurs at all) just wasn\\\\u2019t as interesting. In very short order, any large sauropod was \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Brontosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" as far as non-paleontologists were concerned, just as any large theropod tends to get called \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Tyrannosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" today.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In 1902, Elmer Riggs reclassified \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"B. excelsus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" as a species in the \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Apatosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" genus, i.e. \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"A. excelsus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", which left \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Brontosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" as an invalid genus. But again, the name \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Brontosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" was fixed in the public mind, and many paleontologists refused to go along. Over the next several decades, though, the people who argued for strict adherence to the rules\\\\u2014whichever name is assigned first takes precedence\\\\u2014gradually won out, and finally poor \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Brontosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" became a ghost genus, haunting our imaginations but unacknowledged in museum exhibits and journal papers. It also created several generations of smartass dinosaur-mad kids who never missed an opportunity to say things like \\\\u201cdid you know \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Brontosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" never existed?\\\\u201d I know, because I was one of those kids.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"But. Nobody was ever entirely satisfied with this outcome, and in the early 21st century, a number of researchers started taking a closer look. Specimens originally classified as \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Brontosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", and those classified as \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Apatosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", looked pretty similar in most ways, but very different in some. Those differences are important in taxonomy\\\\u2014and we have much better tools for quantifying the differences, and deciding how important they are, than we did a hundred years ago. The work culminated in the 2015 publication of \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"A specimen-level phylogenetic analysis and taxonomic revision of Diplodocidae (Dinosauria, Sauropoda)\\\", \\\"modifiers\\\": {\\\"link\\\": {\\\"type\\\": \\\"url\\\", \\\"url\\\": \\\"https://peerj.com/articles/857/\\\"}}}, {\\\"text\\\": \\\", which despite the dry title and carefully non-sensationalist presentation, packs a sauropod-size punch: \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Brontosaurus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" is back.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Not everyone agrees with this reclassification, and the debate continues. But I\\\\u2019ve had the chance to examine some of the specimens, and I\\\\u2019m convinced. They were similar, but not the same. And it\\\\u2019s yet another reminder of the diversity of these remarkable animals, as complex and widely varying as anything that lives today.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"questionPageImpressionHash\":\"answer_ranking|1995102877\",\"viewerHasAccess\":true,\"feedbackSurveyVariant\":0,\"tribeItem\":null,\"__typename\":\"Answer\",\"viewHash\":\"a-133096184_3bf4342c225f1203926c9b0f4dc0dd16\",\"isMachineAnswer\":false,\"isSelectedForDigestClickthroughSurvey\":false,\"question\":{\"qid\":45642502,\"id\":\"UXVlc3Rpb25AMDo0NTY0MjUwMg==\",\"isDeleted\":false,\"url\":\"/Why-was-the-Brontosaurus-renamed-to-Apatosaurus\",\"title\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Why was the Brontosaurus renamed to Apatosaurus?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"__typename\":\"Question\",\"isRecentlyGeneratedQuestion\":false,\"isPartnerQuestion\":false,\"isTrendyQuestion\":false,\"isFollowUpQuestion\":false,\"asker\":{\"id\":\"VXNlckAwOjkzOTQyMzU2\",\"__typename\":\"User\",\"isEmployee\":false,\"uid\":93942356},\"slug\":\"Why-was-the-Brontosaurus-renamed-to-Apatosaurus\",\"network\":{\"nid\":0,\"id\":\"TmV0d29yazow\"},\"tribeItem\":null,\"answerCount\":14},\"permaUrl\":\"/Why-was-the-Brontosaurus-renamed-to-Apatosaurus/answer/Daniel-Dvorkin-3\",\"isVisibleTo c3Rpb25AMDo0NTY0MjUwMg==\"},\"answer\":{\"aid\":153706162,\"originalQuestionIfDifferent\":{\"question\":{\"qid\":52257902,\"id\":\"UXVlc3Rpb25AMDo1MjI1NzkwMg==\",\"url\":\"/Why-is-a-brontosaurus-no-longer-called-brontosaurus\",\"title\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Why is a brontosaurus no longer called brontosaurus?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"__typename\":\"Question\",\"isRecentlyGeneratedQuestion\":false,\"isPartnerQuestion\":false,\"isTrendyQuestion\":false,\"isFollowUpQuestion\":false,\"asker\":{\"id\":\"VXNlckAwOjY3ODI0MDg0Ng==\",\"__typename\":\"User\",\"isEmployee\":false,\"uid\":678240846},\"slug\":\"Why-is-a-brontosaurus-no-longer-called-brontosaurus\",\"network\":{\"nid\":0,\"id\":\"TmV0d29yazow\"},\"tribeItem\":null,\"debugInfo\":\"{}\",\"viewer\":{\"user\":null,\"id\":\"Vmlld2VyQDA6MA==\"}},\"id\":\"T3JpZ2luYWxseUFuc3dlcmVkUXVlc3Rpb25AMDoxNTM3MDYxNjI6NTIyNTc5MDI=\",\"originalQuestionText\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Why is a brontosaurus no longer called brontosaurus?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"isQuestionBannerRemoved\":false},\"id\":\"QW5zd2VyQDA6MTUzNzA2MTYy\",\"isDeleted\":false,\"content\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Well, it turns out that brontosaurus might soon be called brontosaurus again!\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In 1877, paleontologist O. C. Marsh discovered a new sauropod species, which he named Apatosaurus.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In 1879, O. C. Marsh discovered another new sauropod species, and he named it Brontosaurus.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"(Brontosaurus and Apatosaurus are genus names, actually, so Marsh assigned an addition species name to the specimens, but those don\\\\u2019t matter for the purposes of this discussion)\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Now Apatosaurus and Brontosaurus were very similar and clearly closely related, but Marsh happened to be embroiled in a bitter feud with another paleontologist at the time, and the two of them were competing for bragging rights in terms of who discovered the most unique specimens.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"So Marsh had ulterior motives biasing him towards naming new genera.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"(Yep, as in so many other things, the origins of the the name \\\\u201cBrontosaurus\\\\u201d can trace its roots back to a dick waving contest between two rival humans\\\\u2026.)\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Then, in 1903, a re-analysis was done, that determined that the Brontosaurus and Apatosaurus specimens were \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"extremely \\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\"similar. Similar enough, in fact, to be considered virtually identical.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Meaning that Brontosaurus and Apatosaurus are actually the same creature, or at least the in the same genus, and since Apatosaurus was named first, by the rules of taxonomy, that\\\\u2019s the name that officially encompassed all the specimens.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"This sort of thing happens all the time in paleontology, and usually this is where it would end, and the discarded name is forgotten to the annals of history.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"But, gosh-darn it, Brontosaurus is just such a \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"good \\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\"name for a giant sauropod. A much \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"better\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" name than Apatosaurus. It sounded better. It rolls off the tongue more easily. It\\\\u2019s more evocative in its meaning.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"People just didn\\\\u2019t want to give it up. So they sort of kept using it. Even labeling museum displays with it, for several more years.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Which resulted in the name getting into the public, and because it is \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"such a GOOD name\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", it immediately skyrocketed in popularity among the lay public.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"(So, as in so many other things, the persistence and preservation of the name \\\\u201cBrontosaurus\\\\u201d in the public imagination came down to aesthetics and fashion.)\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"So for the next century or so we got the situation where the name \\\\u201cBrontosaurus\\\\u201d was iconic, but gradually more and more people end up being made aware that it is not a \\\\u201creal\\\\u201d name of a \\\\u201creal\\\\u201d dinosaur (the specimens previously known as Brontosaurus were very real, of course)\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Fast forward to 2015, when another in depth analysis of the entire diplodocid clade (to which Apatosaurus belongs) was done, using modern methodology and computer analysis of a huge number traits, and an interesting result came out.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"All of the specimens originally classified as \\\\u201cBrontosaurus\\\\u201d clustered as more closely related to one another than they were to all the other specimens classified as \\\\u201cApatosaurus\\\\u201d. Though they were, as expected, \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"very \\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\"closely related.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"And this means that all the specimens formerly known as \\\\u201cBrontosaurus\\\\u201d were a legitimate monophyletic clade, distinct from (or within) the rest of the Apatosaurus group.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Which in turns means that they can all be legitimately given a separate name from the rest of the Apatosaurus specimens again!\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Were they different enough that they could warrant being a separate genus?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Well, the amount of difference that should constitute a different genus has never actually been rigidly defined. There was wiggle room here.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"And. Brontosaurus. Was. Such. A. GOOD. Name\\\\u2026..\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"And so thus it has been proposed that the genus \\\\u201cBrontosaurus\\\\u201d be resurrected to refer to a subset of specimens previously known as \\\\u201cApatosaurus\\\\u201d, to be the sister clade of the rest of the (still) Apatosaurus group.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Last I heard, not everyone is yet in agreement about this, but if I was a betting man, I suspect that the change will stick, at least until some future re-analysis changes it all up again.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Because Brontosaurus is just such a GOOD name. Too many people will just want to have it back too badly\\\\u2026.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"questionPageImpressionHash\":\"answer_ranking|661865765\",\"viewerHasAccess\":true,\"feedbackSurveyVariant\":0,\"tribeItem\":null,\"__typename\":\"Answer\",\"viewHash\":\"a-153706162_dd9af82c5ed6b7b87248e4833acfe7b2\",\"isMachineAnswer\":false,\"isSelectedForDigestClickthroughSurvey\":false,\"question\":{\"qid\":45642502,\"id\":\"UXVlc3Rpb25AMDo0NTY0MjUwMg==\",\"isDeleted\":false,\"url\":\"/Why-was-the-Brontosaurus-renamed-to-Apatosaurus\",\"title\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Why was the Brontosaurus renamed to Apatosaurus?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"__typename\":\"Question\",\"isRecentlyGeneratedQuestion\":false,\"isPartnerQuestion\":false,\"isTrendyQuestion\":false,\"isFollowUpQuestion\":false,\"asker\":{\"id\":\"VXNlckAwOjkzOTQyMzU2\",\"__typename\":\"User\",\"isEmployee\":false,\"uid\":93942356},\"slug\":\"Why-was-the-Brontosaurus-renamed-to-Apatosaurus\",\"network\":{\"nid\":0,\"id\":\"TmV0d29yazow\"},\"tribeItem\":null,\"answerCount\":14},\"permaUrl\":\"/Why-was-the-Brontosaurus-renamed-to-Apatosaurus/answer/Adam-Wu-3\",\"isVisibleToViewer\":true,\"viewerIsAuthor\":false,\"isShortContent\":false,\"galleryData\":null,\"permaUrlOnOriginalQuestion\":\"/Why-is-a-brontosaurus-no-longer-called-brontosaurus/answer/Adam-Wu-3?no_redirect=1\",\"viewerCanRestoreAnswer\":false,\"__isMonetizable\":\"Answer\",\"oid\":153706162,\"contentType\":\"answer\",\"tribe\":null,\"viewer\":{\"consumerBundleSubscription\":null,\"id\":\"Vmlld2VyQDA6MA==\",\"tribeDirectSubscriptions\":[],\"user\":null,\"staticContent\":{\"title\":\"There is help\",\"contentQtextDocument\":{\"legacyJson\":\"{\\\"sections\\\": [{
