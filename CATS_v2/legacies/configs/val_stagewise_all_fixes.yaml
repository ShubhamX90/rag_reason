outputs_dir: "outputs/val_stagewise_all_fixes"
report_md: "outputs/val_stagewise_all_fixes/eval_report.md"
detailed_results_json: "outputs/val_stagewise_all_fixes/detailed_results.json"

pipeline:
  batch_size: 50
  verbose: true

conflict_eval:
  enable: true
  use_judge_committee: true
  correct_refusal_full_credit: true
  require_cross_doc_verification: false
  max_claims_per_answer: 5
  min_entail_confidence: 0.5
  majority_support_rule: true   # majority rule active (ties go to claim)

  committee:
    voting_strategy: "weighted_majority"
    max_concurrent_requests: 50
    priority_overrides:
      anthropic/claude-sonnet-4-6: 3
      openai/gpt-5.4:              2
      deepseek/deepseek-v3.2:      2
