# CATS v2.0 - Local OpenAI-Compatible Committee (ideal 4x H200 anchor)
#
# Intended use:
#   - Run one OpenAI-compatible server per local judge model.
#   - Then run CATS against those endpoints without OPENROUTER_API_KEY.
#
# Committee shape:
#   - Qwen3.5-397B-A17B        priority 4  (Haiku + GPT-5.4 replacement anchor)
#   - DeepSeek-R1-Distill-32B  priority 2
#   - Gemma 4 31B              priority 1
#   - Mistral Small 4          priority 1
#
# The Qwen 397B endpoint is expected to need 4x H200, FP8, TP=4.
# Update base_url ports/hosts to match the nodes where the servers are running.
#
# Run with:
#   python run_evaluation.py \
#     --input data/splits/92p5_7p5/stagewise_multi/val/stage3_final.jsonl \
#     --config configs/val_tier2_local_openai.yaml \
#     --committee local

outputs_dir: "outputs/val_local_openai_4xh200"
report_md: "outputs/val_local_openai_4xh200/eval_report.md"
detailed_results_json: "outputs/val_local_openai_4xh200/detailed_results.json"

pipeline:
  batch_size: 4
  verbose: true

conflict_eval:
  enable: true
  use_judge_committee: true
  correct_refusal_full_credit: true
  require_cross_doc_verification: false
  max_claims_per_answer: 8
  allow_paraphrases: true

  committee:
    type: "local_openai"
    voting_strategy: "weighted_majority"
    max_concurrent_requests: 4
    timeout_seconds: 900
    response_cache_dir: "outputs/local_committee_cache/val_tier2_4xh200"
    cache_mode: "read_write"
    judges:
      - model_id: "local/qwen3.5-397b-a17b"
        base_url: "http://127.0.0.1:8001/v1"
        priority: 4
        max_tokens: 1600
        request_timeout: 900
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

      - model_id: "local/deepseek-r1-distill-32b"
        base_url: "http://127.0.0.1:8002/v1"
        priority: 2
        max_tokens: 2500
        request_timeout: 900

      - model_id: "local/gemma-4-31b"
        base_url: "http://127.0.0.1:8003/v1"
        priority: 1
        max_tokens: 1600
        request_timeout: 900

      - model_id: "local/mistral-small-4"
        base_url: "http://127.0.0.1:8004/v1"
        priority: 1
        max_tokens: 1600
        request_timeout: 900
