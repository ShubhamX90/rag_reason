# CATS v2.0 — Mixed Committee (codex gpt-5.4 anchor + OpenRouter free reasoners)
#
# 4-judge weighted_majority committee:
#   - codex CLI gpt-5.4                       priority 4   (40% weight)
#   - deepseek/deepseek-v3.2 (PAID, ~$0.10)   priority 2   (20%)
#   - qwen/qwen3-235b-a22b:free               priority 2   (20%) — NOT qwen3-32b / qwen2.5-*
#   - meta-llama/llama-3.3-70b-instruct:free  priority 2   (20%) — NOT llama 8B
#
# Requires:
#   - Codex Pro CLI logged in (for gpt-5.4)
#   - OPENROUTER_API_KEY in env (must have ~$0.50 balance for paid deepseek-v3.2;
#     :free judges work with $0)
#
# Run with:
#   python run_evaluation.py \
#     --input data/splits/92p5_7p5/stagewise_multi/val/stage3_final.jsonl \
#     --config configs/val_tier2_mixed.yaml \
#     --committee cli

outputs_dir: "outputs/val_stage3_mixed4_gpt54_dsV32_qwen235_llama70_v2"
report_md: "outputs/val_stage3_mixed4_gpt54_dsV32_qwen235_llama70_v2/eval_report.md"
detailed_results_json: "outputs/val_stage3_mixed4_gpt54_dsV32_qwen235_llama70_v2/detailed_results.json"

pipeline:
  batch_size: 6      # free-tier OpenRouter is rate-limited; lower batch to avoid 429s
  verbose: true

conflict_eval:
  enable: true
  use_judge_committee: true
  correct_refusal_full_credit: true
  require_cross_doc_verification: false
  max_claims_per_answer: 8
  allow_paraphrases: true

  committee:
    type: "mixed"
    codex_model: "gpt-5.4"
    codex_priority: 4                # 4 / (4+2+2+2) = 40% weight
    max_concurrent_requests: 3       # gentle on free-tier rate limits

    openrouter_judges:
      - model_id: "deepseek/deepseek-v3.2"           # paid; the v3.2 you asked for (~$0.10 per 49-sample run)
        priority: 2
      - model_id: "qwen/qwen3-235b-a22b-2507"        # paid; MoE 235B July-2025; NOT qwen3-32b
        priority: 2
      - model_id: "meta-llama/llama-3.3-70b-instruct:free"  # free 70B (paid balance raises rate caps); NOT llama 8B
        priority: 2

    voting_strategy: "weighted_majority"
