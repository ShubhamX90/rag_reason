# CATS v2.0 — Mixed Committee (Codex CLI + DeepSeek direct API)
#
# 2-judge weighted_majority committee:
#   - codex CLI gpt-5.4           priority 3
#   - DeepSeek API model          priority 2
#
# With equal per-call confidence, that is an effective 0.6 / 0.4 weighting.
# Final vote strength is still priority x model-reported confidence.
#
# Requires:
#   - Codex Pro CLI logged in (for gpt-5.4)
#   - DEEPSEEK_API_KEY in env
#
# Run with:
#   python run_evaluation.py \
#     --input data/splits/92p5_7p5/stagewise_multi/val/stage3_final.jsonl \
#     --config configs/val_tier2_mixed.yaml \
#     --committee cli

outputs_dir: "outputs/val_codex_deepseek_v4flash"
report_md: "outputs/val_codex_deepseek_v4flash/eval_report.md"
detailed_results_json: "outputs/val_codex_deepseek_v4flash/detailed_results.json"

pipeline:
  batch_size: 6
  verbose: true

conflict_eval:
  enable: true
  use_judge_committee: true
  correct_refusal_full_credit: true
  require_cross_doc_verification: false
  max_claims_per_answer: 8
  allow_paraphrases: true

  committee:
    type: "mixed"
    codex_model: "gpt-5.4"
    codex_priority: 3
    deepseek_model: "deepseek-v4-flash"
    deepseek_priority: 2
    max_concurrent_requests: 3
    voting_strategy: "weighted_majority"
