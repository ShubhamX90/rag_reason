# CATS v2.0 - staged local committee ceiling pilot
# Stage: Gemma 4 31B only.

outputs_dir: "outputs/val_gold_ceiling_local_staged/gemma31_collect"
report_md: "outputs/val_gold_ceiling_local_staged/gemma31_collect/eval_report.md"
detailed_results_json: "outputs/val_gold_ceiling_local_staged/gemma31_collect/detailed_results.json"

pipeline:
  batch_size: 1
  verbose: true

conflict_eval:
  enable: true
  use_judge_committee: true
  correct_refusal_full_credit: true
  require_cross_doc_verification: false
  max_claims_per_answer: 8
  allow_paraphrases: true

  committee:
    type: "local_openai"
    voting_strategy: "weighted_majority"
    max_concurrent_requests: 1
    timeout_seconds: 900
    response_cache_dir: "outputs/local_committee_cache/val_gold_ceiling_qwen397_4judge_ctxfit500"
    cache_mode: "read_write"
    judges:
      - model_id: "local/gemma-4-31b"
        base_url: "http://127.0.0.1:18013/v1"
        priority: 1
        max_tokens: 400
        request_timeout: 900
