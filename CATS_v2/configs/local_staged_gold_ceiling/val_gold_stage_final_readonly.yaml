# CATS v2.0 - staged local committee ceiling pilot
# Final read-only aggregation after all four per-model cache collection passes.

outputs_dir: "outputs/val_gold_ceiling_local_staged/final_readonly"
report_md: "outputs/val_gold_ceiling_local_staged/final_readonly/eval_report.md"
detailed_results_json: "outputs/val_gold_ceiling_local_staged/final_readonly/detailed_results.json"

pipeline:
  batch_size: 8
  verbose: true

conflict_eval:
  enable: true
  use_judge_committee: true
  correct_refusal_full_credit: true
  require_cross_doc_verification: false
  max_claims_per_answer: 8
  allow_paraphrases: true

  committee:
    type: "local_openai"
    voting_strategy: "weighted_majority"
    max_concurrent_requests: 8
    timeout_seconds: 30
    response_cache_dir: "outputs/local_committee_cache/val_gold_ceiling_qwen397_4judge_ctxfit500"
    cache_mode: "read_only"
    judges:
      - model_id: "local/qwen3.5-397b-a17b"
        base_url: "http://127.0.0.1:8001/v1"
        priority: 4
        max_tokens: 400
        request_timeout: 30
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

      - model_id: "local/deepseek-r1-distill-32b"
        base_url: "http://127.0.0.1:18012/v1"
        priority: 2
        max_tokens: 400
        request_timeout: 30

      - model_id: "local/gemma-4-31b"
        base_url: "http://127.0.0.1:18013/v1"
        priority: 1
        max_tokens: 400
        request_timeout: 30

      - model_id: "local/mistral-small-4"
        base_url: "http://127.0.0.1:8004/v1"
        priority: 1
        max_tokens: 400
        request_timeout: 30
