# CATS v2.0 - benchmark staged local committee final aggregation
#
# Run after the Qwen, Mistral, and DeepSeek collection configs have all
# populated the shared benchmark response cache.
# This pass should run with no model servers required.

outputs_dir: "outputs/benchmark_local_committee_3judge/run_outputs/final_readonly"
report_md: "outputs/benchmark_local_committee_3judge/run_outputs/final_readonly/eval_report.md"
detailed_results_json: "outputs/benchmark_local_committee_3judge/run_outputs/final_readonly/detailed_results.json"

pipeline:
  batch_size: 8
  verbose: true

conflict_eval:
  enable: true
  use_judge_committee: true
  correct_refusal_full_credit: true
  require_cross_doc_verification: false
  max_claims_per_answer: 8
  allow_paraphrases: true

  committee:
    type: "local_openai"
    voting_strategy: "weighted_majority"
    max_concurrent_requests: 8
    timeout_seconds: 30
    response_cache_dir: "outputs/benchmark_local_committee_3judge/response_cache"
    cache_mode: "read_only"
    judges:
      - model_id: "local/qwen3.5-397b-a17b"
        base_url: "http://127.0.0.1:8001/v1"
        priority: 6
        max_tokens: 400
        request_timeout: 30
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

      - model_id: "local/mistral-small-4"
        base_url: "http://127.0.0.1:8004/v1"
        priority: 3
        max_tokens: 400
        request_timeout: 30

      - model_id: "local/deepseek-r1-distill-32b"
        base_url: "http://127.0.0.1:8002/v1"
        priority: 2
        max_tokens: 500
        request_timeout: 30
