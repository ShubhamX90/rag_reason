outputs_dir: "outputs/val_tier1"
report_md: "outputs/val_tier1/eval_report.md"
detailed_results_json: "outputs/val_tier1/detailed_results.json"

pipeline:
  batch_size: 50
  verbose: true

conflict_eval:
  enable: true
  use_judge_committee: true
  correct_refusal_full_credit: true
  require_cross_doc_verification: false
  max_claims_per_answer: 5
  # R2: lower NLI confidence floor from 0.5 → 0.3
  # Weak entailment (conf 0.3–0.49) still counts as evidence
  min_entail_confidence: 0.3
  majority_support_rule: true
  # R1: all-neutral claims (e=0, c=0) pass as supported
  # Rationale: retrieved snippets missing the evidence ≠ hallucination on gold data
  neutral_as_support: true
  committee:
    voting_strategy: "weighted_majority"
    max_concurrent_requests: 50
    priority_overrides:
      anthropic/claude-sonnet-4-6: 3
      openai/gpt-5.4:              2
      deepseek/deepseek-v3.2:      2
